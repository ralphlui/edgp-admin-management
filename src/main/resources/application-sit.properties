spring.datasource.driver-class-name=com.amazonaws.secretsmanager.sql.AWSSecretsManagerMySQLDriver
spring.datasource.url=jdbc-secretsmanager:mysql://edgp-sit.cfqm8kgg2pur.ap-southeast-1.rds.amazonaws.com:3306/admin
spring.datasource.username=rds-credentials-edgp-sit

spring.config.import=aws-secretsmanager:sit/edgp/secret

spring.cloud.aws.region.static=ap-southeast-1
spring.cloud.aws.credentials.access-key=${aws_access_key_id}
spring.cloud.aws.credentials.secret-key=${aws_secret_key_id}
jwt.private.key=${jwt_private_key}
jwt.public.key=${jwt_public_key}
aes.secret.key=${aes_secret_key}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081

client.url=${CLIENT_URL}

aws.sqs.queue.audit.url=${AUDIT_SQS_URL}
audit.activity.type.prefix=Admin-


pentest.enable=${PENTEST_ENABLE}
secure.flag.enable=${SECURE_ENABLE}
demo.flag.enable= ${DEMO_ENABLE}

notification.api.url= ${NOTIFICATION_URL}
organization.api.url= ${ORGANIZATION_URL}